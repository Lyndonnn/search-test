data:
  train_files: mmsearch_r1/data/mini_data.pq
  val_files: mmsearch_r1/data/mini_data.pq
  train_batch_size: 1
  max_prompt_length: 1024
  max_response_length: 64
  image_key: images
  user_prompt_round_1: mmsearch_r1/prompts/round_1_user_prompt_qwenvl.pkl
  user_prompt_after_text_search: mmsearch_r1/prompts/round_1_user_prompt_qwenvl.pkl
  user_prompt_after_image_search: mmsearch_r1/prompts/round_1_user_prompt_qwenvl.pkl

algorithm:
  adv_estimator: grpo
  filter_groups:
    enable: false

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-VL-3B-Instruct
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 2e-6
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    use_multi_turn_response_mask: false
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
  rollout:
    name: hf
  ref:
    micro_batch_size_per_gpu: 1
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false

trainer:
  logger: ['console']
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  total_training_steps: 5
  save_freq: 1000000
  test_freq: 1000000
  val_before_train: false
  search_penalty: 0.1
  format_penalty: 0.1
  reward_mode: EM
